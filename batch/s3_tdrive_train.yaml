checkpoint_interval: 5000
eval_interval: 200
log_interval: 25
batch_size: 4
epochs: 1
num_workers: 0

plot_norms: False

lr: 0.001
weight_decay: 0.0
prior:

data:
  base_dir: ../../datasets/tdrive
  train_path: train.src
  val_path: val.src
  ref_path: eval.src
  seq_len: 50
  oovs: 10
  swaps: 0.0

vocab:
  embeddings_dim: 100
  size: 15000

model:
  clip: 1
  pack: True
  loss_weight_reconstruction: 1
  prior_loss: False
  loss_weight_prior: 0.1
  local_topic_loss: False
  loss_weight_local_topic: 2
  local_topic_distance: euclidean
  topic_loss: True
  loss_weight_topic: 1
  topic_idf: True
  topic_distance: cosine
  length_loss: False
  loss_weight_length: 0.01
  neo_loss: False
  loss_weight_neo: 10
  min_ratio: 0.2
  max_ratio: 0.6
  min_length: 15
  max_length: 30
  test_min_ratio: 0.3
  test_max_ratio: 0.31
  test_min_length: 2
  test_max_length: 15
  tie_decoder_outputs: True
  tie_embedding_outputs: True
  tie_embedding: True
  tie_decoders: True
  tie_encoders: True
  length_control: True
  err_control: False
  bridge_hidden: True
  bridge_non_linearity: tanh
  emb_size: 100
  embed_dropout: 0.0
  embed_trainable: True
  embed_masked: False
  layer_norm: False
  gnn_used: False
  gnn_latent_dim: 128
  enc_token_dropout: 0.0
  dec_token_dropout: 0.5
  enc_rnn_size: 300
  dec_rnn_size: 300
  rnn_layers: 2
  rnn_dropout: 0.0
  rnn_type: LSTM
  rnn_bidirectional: True
  attention: True
  attention_fn: general
  attention_coverage: False
  input_feeding: True
  input_feeding_learnt: True
  out_non_linearity: tanh
  sampling: 0.0
  top: False
  hard: False
  gumbel: False
  tau: 0.5
  learn_tau: True
  tau_0: 0.5
  mask: False
  mask_fn: trj
  metric: sed
